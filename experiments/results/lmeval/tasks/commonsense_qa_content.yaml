# Sensitivity control for base LMs that collapse to the letter "A" on the
# upstream task. Score answer text directly; do not compare this custom score
# to published upstream CommonsenseQA numbers.
task: commonsense_qa_content
dataset_path: tau/commonsense_qa
output_type: multiple_choice
training_split: train
validation_split: validation
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{choices.label.index(answerKey)}}"
doc_to_choice: "{{choices.text}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
