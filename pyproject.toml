[project]
name = "dagformer"
version = "0.1.0"
description = "Context-conditioned DAG topology predictor for OLMo2-1B"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets",
    "wandb",
    "pyyaml",
    "einops",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
