# D4 (post hoc, 2026-10-04): 75M learning-rate sweep point; identical to the timan 75M pair's config except lr (and predictor_lr scaled 0.6x), 1 GPU: micro 4 x accum 129 = 528,384 tokens/step.

# Machine-local copy of pretrain_75m_baseline_mmap.yaml (dense decoder-only OLMo-2 75M, no routing) for timan1
# (3x RTX A6000, GPUs 0,2,3) on the local 12B-token Dolma v1.7 prefix corpus -- the dense baseline for the
# fourway_corrected / fourway_modular runs built with the same pipeline.
# Identical to the original except: mmap_index_path / save_dir (local disk); micro_batch_size 8 -> 4 and
# gradient_accumulation_steps 16 -> 43 so that, on 3 GPUs, the global batch (516 seqs = 528,384 tokens/step) and the
# eval-cache batching (micro 4) are exactly those of the two DAGFormer runs; save_every 3000 -> 1500 (mid-run checkpoint).

# Dense OLMo-2 75M baseline for scaling law
# ~77M unique params, Chinchilla-optimal 1.5B tokens
# Tokens/step: 8 × 16 accum × 4 GPUs × 1024 = 524K
# Wall time estimate: ~2h on 4× A40

hidden_size: 512
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 2048
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/srv/local/xy51/data/pretok/dolma_v1_7_12b"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 129
total_steps: 3000
lr: 1e-3
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "extras-75m-dense-lr1e3-dolma12b"
log_every: 10
save_every: 1500
save_dir: "/srv/local/xy51/checkpoints/extras_75m_dense_lr1e3_dolma12b"
