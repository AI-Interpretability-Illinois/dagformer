# Table 1 fill (owner, 2026-10-06): PARAMETER-MATCHED dense for the 300M pair (21B corpus). DAGFormer-300M = 304.1M backbone
# + 32.3M routing = 336.4M; this dense OLMo-2 widens hidden 1024 -> 1088 (16 heads of 68, MLP 4096 -> 4352):
# 100352*1088 + 12*16*1088^2 = 336.5M (matched within 0.1%). Trainer: scripts/pretrain_baseline.py.
# 4 GPUs x micro 4 x accum 32 x 1024 = 524,288 tokens/step, 12000 steps, seed 42, lr 5e-4, warmup 300, linear (the 300M pair's recipe).
hidden_size: 1088
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4352
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "/work/hdd/bfqt/shared/dagformer-models/tokenizer"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/work/hdd/bfqt/xiaocong/dagformer_pruning/data/dolma_v1_7_21b"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 32
total_steps: 12000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 300
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 0
eval_size: 200
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "extras-300m_dense_w1088"
log_every: 10
save_every: 500
keep_last_n: 1
save_dir: "/work/hdd/biro/xiaocong/dagformer_extras2/300m_dense_w1088"
