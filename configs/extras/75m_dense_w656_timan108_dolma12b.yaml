# D1 (post hoc, 2026-10-04): PARAMETER-MATCHED dense baseline for the timan 75M pair.
# The 75M DAGFormer (pretrain_75m_dagformer_fourway_timan1_dolma12b.yaml) has 76.6M backbone + 29.1M routing
# parameters = 105.7M. This dense OLMo-2 widens hidden 512 -> 656 (8 heads of 82, MLP 2048 -> 2624):
# 100352*656 + 6*(4*656^2 + 3*656*2624) = 107.1M parameters, i.e. matched within 1.3% (slightly above).
# Everything else is the timan 75M dense recipe: same corpus (local 12B' rebuild), 528,384 tokens/step
# (micro 4 x accum 43 x 3 GPUs), 3000 steps, seed 42 (same data order), lr 5e-4, warmup 200, linear decay.
# Runs on timan108 GPUs 0-2 (RTX A5000 24GB).

hidden_size: 656
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 2624
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/srv/local/xy51/data/pretok/dolma_v1_7_12b"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 43
total_steps: 3000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "extras-75m-dense-w656-dolma12b"
log_every: 10
save_every: 1500
save_dir: "/srv/local/xy51/checkpoints/extras_75m_dense_w656_dolma12b"
