# Table 1 (owner, 2026-10-06 22:37): paper-exact dynamic Hyper-Connections (DHCx4, one module per sub-layer, LayerNorm; arXiv:2409.19606)
# at 300M on the 21B corpus with the 300M pair's recipe: 4 GPUs x micro 2 x accum 64 x 1024 = 524,288 tokens/step,
# 12000 steps, seed 42, lr 5e-4, warmup 300, linear. Trainer: scripts/pretrain_hc_paper.py.
hidden_size: 1024
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4096
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "/work/hdd/bfqt/shared/dagformer-models/tokenizer"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/work/hdd/bfqt/xiaocong/dagformer_pruning/data/dolma_v1_7_21b"
seq_len: 1024
seed: 42

micro_batch_size: 2
gradient_accumulation_steps: 64
total_steps: 12000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 300
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 0
eval_size: 200
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "extras-300m-hc_paper-21b"
log_every: 10
save_every: 500
keep_last_n: 1
save_dir: "/work/hdd/biro/xiaocong/dagformer_extras2/300m_hc_paper"
