# D4 (post hoc, 2026-10-04): 75M learning-rate sweep point; identical to the timan 75M pair's config except lr (and predictor_lr scaled 0.6x), 1 GPU: micro 4 x accum 129 = 528,384 tokens/step.

# Machine-local copy of pretrain_75m_dagformer_mmap.yaml (fourway_corrected: standard connections fixed, extra
# hyperconnections predicted) for timan1 (3x RTX A6000, GPUs 1,2,3) on the local 12B-token Dolma v1.7 prefix corpus.
# Identical to the original except mmap_index_path / save_dir (local disk) and gradient_accumulation_steps 32 -> 43
# (3 GPUs keep the 512-seq global batch: 516) -- the same two overrides used for the fourway_modular run, so the two
# runs differ only in routing_mode (and use_torch_compile, which the modular config had turned off).

# FourWay DAGFormer 75M for scaling law
# Same architecture as 75M baseline + routing predictor
# Chinchilla-optimal 1.5B tokens
# Wall time estimate: ~5h on 4× A40

hidden_size: 512
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 2048
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

routing_mode: "fourway_corrected"
predictor_encoder_dim: 256
predictor_encoder_layers: 2
predictor_encoder_heads: 4
predictor_max_seq_len: 4096
fourway_hidden: 512
predictor_causal: true
correction_hidden: 128

replace_rmsnorm: true
use_torch_compile: true

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/srv/local/xy51/data/pretok/dolma_v1_7_12b"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 129
total_steps: 3000
lr: 1e-3
predictor_lr: 0.0006
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "extras-75m-dagformer-lr1e3-dolma12b"
log_every: 10
save_every: 1500
save_dir: "/srv/local/xy51/checkpoints/extras_75m_dagformer_lr1e3_dolma12b"
