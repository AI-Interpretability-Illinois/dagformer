# timan108 copy (owner instruction 19:36 Oct 4: use idle timan GPUs): 3 GPUs x micro 4 x accum 43 = 528,384 tokens/step, the timan 150M pair batch.
# D2 (post hoc, 2026-10-04): Hyper-Connections (4 static streams, builder defaults) at 150M on the timan 150M pair's corpus
# (12B'), tokens/step, steps and schedule (scripts/pretrain_hyperconnection.py). 1 GPU: micro 4 x accum 129.

hidden_size: 768
num_hidden_layers: 8
num_attention_heads: 12
intermediate_size: 3072
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/srv/local/xy51/data/pretok/dolma_v1_7_12b"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 43
total_steps: 6000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 300
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "extras-150m-hyperconnection-dolma12b-timan108"
log_every: 10
save_every: 300   # 1500 until 2026-10-05 15:00; tightened on timan108 while a co-tenant kept the cards near OOM
save_dir: "/srv/local/xy51/checkpoints/extras_150m_hyperconnection_dolma12b"
keep_last_n: 1
