# DDP test — 4× A40, 100 steps, verify multi-GPU works
# Compare eval NLL with single-GPU run to confirm equivalence

# Model
olmo_model_id: "allenai/OLMo-2-0425-1B"
olmo_revision: "stage1-step1907359-tokens4001B"
qwen_model_id: "Qwen/Qwen3-Embedding-0.6B"

# Predictor
predictor_hidden_dim: 1024
predictor_rank: 32
cascading_gate_k: 5.0
input_norm: "none"
init_logit: 15.0

# Data
dataset: "allenai/dolmino-mix-1124"
dataset_name: "dolmino_mix"
seq_len: 1024
batch_size: 4           # per-GPU batch (effective = 4 * 4 GPUs = 16)
micro_batch_size: 1
qwen_input_prefix: ""

# Eval
eval_skip: 10000
eval_size: 50

# Training — short test
total_steps: 100
lr: 3e-4
weight_decay: 0.1
optimizer: "adamw"
lr_schedule: "linear"
max_grad_norm: 1.0

# Schedules
tau_init: 5.0
tau_final: 5.0
tau_schedule: "cosine"
lambda_max: 0.0
lambda_warmup_frac: 0.2

# Logging
wandb_project: "dagformer"
wandb_run_name: "p2-ddp-test"
log_every: 10
eval_every: 50

# Checkpointing
save_every: 1000        # don't save during short test
save_dir: "checkpoints/p2_ddp_test/"

# Phase 2
phase: 2
olmo_lr: 5e-6
predictor_lr: 1e-3
gradient_checkpointing: true

# Hardware
num_gpus: 4
