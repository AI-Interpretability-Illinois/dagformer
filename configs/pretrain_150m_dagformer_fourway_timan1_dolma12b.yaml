# Machine-local copy of pretrain_150m_dagformer_mmap.yaml (fourway_corrected) for timan1 (3x A6000, GPUs 1,2,3) on the
# local 12B-token Dolma v1.7 prefix corpus. Identical to the original except mmap_index_path / save_dir and
# gradient_accumulation_steps 32 -> 43 (3 GPUs keep the 512-seq global batch: 516 seqs = 528,384 tokens/step; 6000 steps = 3.17B tokens).

# FourWay DAGFormer 150M for scaling law
# Same architecture as 150M baseline + routing predictor
# Chinchilla-optimal 3B tokens
# Wall time estimate: ~12h on 4× A40

hidden_size: 768
num_hidden_layers: 8
num_attention_heads: 12
intermediate_size: 3072
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

routing_mode: "fourway_corrected"
predictor_encoder_dim: 256
predictor_encoder_layers: 2
predictor_encoder_heads: 4
predictor_max_seq_len: 4096
fourway_hidden: 512
predictor_causal: true
correction_hidden: 128

replace_rmsnorm: true
use_torch_compile: true

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/srv/local/xy51/pretok/dolma_v1_7_12b"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 43
total_steps: 6000
lr: 5e-4
predictor_lr: 3e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 300
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "dagformer-150m-fourway-dolma12b"
log_every: 10
save_every: 1500
save_dir: "/srv/local/xy51/checkpoints/pretrain_150m_dagformer_fourway_dolma12b"
