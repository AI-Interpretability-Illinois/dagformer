# DAGFormer 300M — Mini-encoder predictor (independent embedding + small transformer)
# Own embedding table (100K × 256 = 25.7M params) + 2-layer transformer encoder.
# Learns contextual sequence representation optimized for topology prediction.
# Load baseline checkpoint for base model, predictor starts fresh.

# ── Model ──
hidden_size: 1024
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4096
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

# ── Predictor ──
predictor_type: "mini_encoder"
predictor_hidden_dim: 1024
predictor_rank: 32
predictor_lr: 3e-4
predictor_encoder_dim: 256
predictor_encoder_layers: 2
predictor_encoder_heads: 4
cascading_gate_k: 5.0
init_logit: 15.0
input_norm: "none"

# ── Staged training ──
baseline_checkpoint: "checkpoints/pretrain_300m_baseline/checkpoint_step10000.pt"

# ── Schedules ──
tau_init: 5.0
tau_final: 0.2
lambda_max: 0.01
lambda_warmup_frac: 0.2

# ── Data ──
dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

# ── Training ──
micro_batch_size: 4
gradient_accumulation_steps: 32
total_steps: 2000

lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 100
max_grad_norm: 1.0
lr_schedule: "linear"

# ── Eval ──
eval_skip: 1000000
eval_size: 50
eval_every: 200

# ── Logging ──
wandb_project: "dagformer"
wandb_run_name: "pretrain-300m-mini-encoder"
log_every: 10

# ── Checkpointing ──
save_every: 500
save_dir: "checkpoints/pretrain_300m_mini_encoder"
