# Phase 2: unfreeze LLM after 1000 steps of predictor-only training
# Loads predictor + same random LLM from predictor-only checkpoint step 1000

hidden_size: 1024
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4096
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

predictor_type: "seq2matrix"
predictor_rank: 32
predictor_lr: 3e-4
predictor_encoder_dim: 256
predictor_encoder_layers: 2
predictor_encoder_heads: 4
predictor_cross_attn_heads: 4
predictor_max_seq_len: 4096
cascading_gate_k: 5.0
init_logit: 15.0
input_norm: "none"

# Load both predictor and base model from predictor-only checkpoint
predictor_checkpoint: "checkpoints/pretrain_300m_seq2matrix_predonly/checkpoint_step1000.pt"

tau_init: 5.0
tau_final: 0.2
lambda_max: 0.01
lambda_warmup_frac: 0.2

dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 32
total_steps: 5000
lr: 5e-4
predictor_lr: 3e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 200

wandb_project: "dagformer"
wandb_run_name: "s2m-phase2-from1000"
log_every: 10

save_every: 5000
save_dir: "checkpoints/pretrain_300m_seq2matrix_phase2_from1000"
