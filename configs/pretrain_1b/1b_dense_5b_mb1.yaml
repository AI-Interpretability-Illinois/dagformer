# 1B dense OLMo-2 baseline at 5B tokens on the reserved A100x4 node (scripts/pretrain_baseline.py).
# 4 GPUs x micro 1 x accum 128 x 1024 = 524,288 tokens/step; 9540 steps = 5B tokens.
# Same corpus, tokenizer, batch and schedule as the routed 1B runs (configs/pretrain_1b/1b_*_5b_*.yaml).
hidden_size: 2048
num_hidden_layers: 16
num_attention_heads: 16
intermediate_size: 8192
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "/work/hdd/bfqt/shared/dagformer-models/tokenizer"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/work/hdd/bfqt/xiaocong/dagformer_pruning/data/dolma_v1_7_21b"
seq_len: 1024
seed: 42

micro_batch_size: 1
gradient_accumulation_steps: 128
total_steps: 9540
lr: 4e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 500
max_grad_norm: 1.0
lr_schedule: "linear"
lr_decay_steps: 9540

eval_skip: 0
eval_size: 200
eval_every: 1000

wandb_project: "dagformer"
wandb_run_name: "1b-dense-dolma5b"
log_every: 10
save_every: 250
keep_last_n: 2
save_dir: "/work/hdd/bfqt/xiaocong/dagformer_1b/1b_dense_5b"
