# DAGFormer 300M — Self-embed without detach (unfrozen embedding input)
# Load trained baseline checkpoint, use model's own embeddings as predictor
# input WITHOUT .detach() — gradients flow from predictor loss back into
# the embedding layer. Similar to Qwen version but uses own embeddings.
# 2000 additional steps × 524K tokens/step ≈ 1.05B extra tokens.

# ── Model ──
hidden_size: 1024
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4096
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

# ── Predictor ──
predictor_type: "self_embed"
predictor_hidden_dim: 1024
predictor_rank: 32
predictor_lr: 3e-4
cascading_gate_k: 5.0
init_logit: 15.0
input_norm: "none"

# ── Staged + unfrozen embed ──
baseline_checkpoint: "checkpoints/pretrain_300m_baseline/checkpoint_step10000.pt"
detach_predictor_input: false

# ── Schedules ──
tau_init: 5.0
tau_final: 0.2
lambda_max: 0.01
lambda_warmup_frac: 0.2

# ── Data ──
dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

# ── Training ──
micro_batch_size: 4
gradient_accumulation_steps: 32
total_steps: 2000

lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 100
max_grad_norm: 1.0
lr_schedule: "linear"

# ── Eval ──
eval_skip: 1000000
eval_size: 50
eval_every: 200

# ── Logging ──
wandb_project: "dagformer"
wandb_run_name: "pretrain-300m-selfembed-nodetach"
log_every: 10

# ── Checkpointing ──
save_every: 500
save_dir: "checkpoints/pretrain_300m_selfembed_nodetach"
