# Dense OLMo-2 150M baseline for scaling law
# ~153M unique params, Chinchilla-optimal 3B tokens
# Tokens/step: 8 × 16 accum × 4 GPUs × 1024 = 524K
# Wall time estimate: ~5h on 4× A40

hidden_size: 768
num_hidden_layers: 8
num_attention_heads: 12
intermediate_size: 3072
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

micro_batch_size: 8
gradient_accumulation_steps: 16
total_steps: 6000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 300
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 0
eval_size: 0
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "baseline-150m"
log_every: 10
save_every: 6000
save_dir: "checkpoints/pretrain_150m_baseline"
