# P1-Stage1 — Phase 1 on stage1-final (pretrain only, 4T tokens)
# Purpose: Does pretrain-only OLMo have a better topology than dense?
olmo_model_id: "allenai/OLMo-2-0425-1B"
olmo_revision: "stage1-step1907359-tokens4001B"
qwen_model_id: "Qwen/Qwen3-Embedding-0.6B"

predictor_hidden_dim: 1024
predictor_rank: 32
cascading_gate_k: 5.0
input_norm: "none"
init_logit: 3.0

dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
batch_size: 4
micro_batch_size: 2
qwen_input_prefix: ""

eval_skip: 10000
eval_size: 50

total_steps: 12500
lr: 3e-4
weight_decay: 0.01
optimizer: "adamw"

tau_init: 2.0
tau_final: 2.0
tau_schedule: "cosine"
lambda_max: 0.0
lambda_warmup_frac: 0.2

wandb_project: "dagformer"
wandb_run_name: "p1-stage1-final"
log_every: 10
eval_every: 500

save_every: 2500
save_dir: "checkpoints/p1_stage1/"
num_gpus: 1
