# Track 3: Staged training with FROZEN base model.
# Load a pretrained dense baseline (train=eval=3.85) and add FourWay
# routing on top. Base model weights are FROZEN — only predictor +
# corrections learn.
#
# Tests the "base model co-adaptation" hypothesis:
# - If gap < 0.5: base model memorizing via routing signals was the cause
# - If gap ~ 1.65: dynamic routing mechanism itself has a generalization ceiling
#
# The dense baseline checkpoint is at:
#   checkpoints/pretrain_300m_baseline_5k/checkpoint_step5000.pt

hidden_size: 1024
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4096
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

routing_mode: "fourway_corrected"
predictor_encoder_dim: 256
predictor_encoder_layers: 2
predictor_encoder_heads: 4
predictor_max_seq_len: 4096
fourway_hidden: 512
predictor_causal: true
correction_hidden: 128

freeze_base_model: true              # <-- KEY: base model FROZEN
baseline_checkpoint: "checkpoints/pretrain_300m_baseline_5k/checkpoint_step5000.pt"

dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 32
total_steps: 5000
lr: 5e-4                            # ignored (base frozen)
predictor_lr: 3e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "fourway_staged_freeze_base"
log_every: 10
save_every: 1000
save_dir: "checkpoints/fourway_staged_freeze_base"
