# DenseFormer 75M for scaling-law Pareto frontier
# Base = dense OLMo-2 75M (configs/pretrain_75m_baseline.yaml) + DWA taps.
# DWA adds only ~L^2/2 scalar params -> param count ~ dense baseline.
# DWA knobs (dwa_dilation=1, dwa_period=1 => dense, every block) are the
# builder defaults and are intentionally NOT set here: PretrainConfig rejects
# unknown YAML keys, and build_denseformer reads them via getattr(...,default).
# Tokens/step: 8 x 16 accum x 4 GPUs x 1024 = 524K ; matched to baseline (3000 steps).

hidden_size: 512
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 2048
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

# Pretokenized mmap shards (prepared for later; path may not exist yet).
data_source: "mmap"
mmap_index_path: "/work/hdd/bfqt/data/pretok/dolma_v1_7_12b"

micro_batch_size: 8
gradient_accumulation_steps: 16
total_steps: 3000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "denseformer-75m"
log_every: 10
save_every: 3000
save_dir: "checkpoints/pretrain_75m_denseformer"
