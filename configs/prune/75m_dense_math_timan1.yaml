# 75m dense (timan1 12B-corpus checkpoint): gradual pruning while finetuning on MathInstruct. micro 2 x accum 16 = same 32K tok/step (GPU 0 shares 48 GB with a 34 GB vLLM server; eval caches rebuilt with batch 4).
# Pair with configs/prune/75m_baseline_math.yaml for the matched comparison.
model_dir: /srv/local/xy51/prune/models/75m-dense
save_dir: /srv/local/xy51/prune/checkpoints/75m_dense_math_s50
wandb_run_name: prune-75m-dense-math-s50

train_index_path: /srv/local/xy51/prune/data/mathinstruct/train
eval_cache_path: /srv/local/xy51/prune/data/mathinstruct/eval_cache.pt
general_eval_cache_path: /srv/local/xy51/prune/data/wikitext2/eval_cache.pt
seq_len: 1024
seed: 42

micro_batch_size: 2
gradient_accumulation_steps: 16
total_steps: 2000
lr: 1.0e-4
predictor_lr: 1.0e-4
warmup_steps: 100
lr_schedule: linear
weight_decay: 0.1
max_grad_norm: 1.0

prune_units: [head, neuron]
target_sparsity: 0.5
prune_start_step: 200
prune_end_step: 1400
prune_every: 100
importance: taylor
min_alive_per_layer: {head: 1}
eval_after_prune: true

eval_every: 200
eval_max_batches: 0
log_every: 10
save_every: 500
