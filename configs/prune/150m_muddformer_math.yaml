# 150M muddformer (streamed-Dolma era checkpoint; compare only within this trio):
# gradual head+neuron pruning while finetuning on MathInstruct.
model_dir: /work/hdd/bfqt/xiaocong/dagformer_pruning/models/150m-muddformer
save_dir: /work/hdd/bfqt/xiaocong/dagformer_pruning/checkpoints/150m_muddformer_math_s50
wandb_run_name: prune-150m-muddformer-math-s50

train_index_path: /work/hdd/bfqt/xiaocong/dagformer_pruning/data/mathinstruct/train
eval_cache_path: /work/hdd/bfqt/xiaocong/dagformer_pruning/data/mathinstruct/eval_cache.pt
general_eval_cache_path: /work/hdd/bfqt/xiaocong/dagformer_pruning/data/wikitext2/eval_cache.pt
seq_len: 1024
seed: 42

micro_batch_size: 8
gradient_accumulation_steps: 4
total_steps: 2000
lr: 1.0e-4
predictor_lr: 1.0e-4
warmup_steps: 100
lr_schedule: linear
weight_decay: 0.1
max_grad_norm: 1.0

prune_units: [head, neuron]
target_sparsity: 0.5
prune_start_step: 200
prune_end_step: 1400
prune_every: 100
importance: taylor
min_alive_per_layer: {head: 1}
eval_after_prune: true

eval_every: 200
eval_max_batches: 0
log_every: 10
save_every: 500
