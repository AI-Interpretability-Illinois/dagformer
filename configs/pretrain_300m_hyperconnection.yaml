# Hyper-Connections 300M baseline (arXiv:2409.19606) for the FLOPs x loss frontier.
# Same Olmo2 backbone / dims / token budget as configs/pretrain_300m.yaml;
# the ONLY architectural difference is n=4 parallel residual streams with static-
# learnable width/depth connections (defaults in build_hyperconnection: hc_num_streams=4,
# hc_dynamic=False). Those two knobs are NOT YAML fields (PretrainConfig rejects
# unknown keys); they are read via getattr with defaults, so leave them out here.
# ~304M params (hyper-connections add <0.1%), ~6.3B tokens (12000 steps x 524K).
# Tokens/step: 8 x 16 accum x 4 GPUs x 1024 = 524K

hidden_size: 1024
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4096
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

# Pretokenized mmap shards (being built now; path may not exist yet).
data_source: "mmap"
mmap_index_path: "/work/hdd/bfqt/data/pretok/dolma_v1_7_12b"

micro_batch_size: 8
gradient_accumulation_steps: 16
total_steps: 12000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 300
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "hyperconnection-300m"
log_every: 10
save_every: 2000
save_dir: "checkpoints/pretrain_300m_hyperconnection"
