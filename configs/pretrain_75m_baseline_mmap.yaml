# Dense OLMo-2 75M baseline for scaling law
# ~77M unique params, Chinchilla-optimal 1.5B tokens
# Tokens/step: 8 × 16 accum × 4 GPUs × 1024 = 524K
# Wall time estimate: ~2h on 4× A40

hidden_size: 512
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 2048
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/work/hdd/bfqt/data/pretok/dolma_v1_7_12b"
seq_len: 1024
seed: 42

micro_batch_size: 8
gradient_accumulation_steps: 16
total_steps: 3000
lr: 5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "baseline-75m"
log_every: 10
save_every: 3000
save_dir: "checkpoints/pretrain_75m_baseline_mmap"
