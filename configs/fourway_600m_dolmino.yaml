# FourWay DAGFormer 600M on Dolmino mix
# Matches pretrain_600m_baseline_dolmino.yaml for apples-to-apples comparison.
# Uses vnorm regularization (V post-mix RMSNorm) — same as 1B DAGFormer.

hidden_size: 1536
num_hidden_layers: 14
num_attention_heads: 16
intermediate_size: 6144
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

routing_mode: "fourway_corrected"
predictor_encoder_dim: 256
predictor_encoder_layers: 2
predictor_encoder_heads: 4
predictor_max_seq_len: 4096
fourway_hidden: 512
predictor_causal: true
correction_hidden: 128
use_v_norm: true

replace_rmsnorm: true
use_torch_compile: false

dataset: "allenai/dolmino-mix-1124"
dataset_name: "dolmino_mix"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 16
total_steps: 22900
lr: 4.5e-4
predictor_lr: 2.5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 500
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 0
eval_size: 0

wandb_project: "dagformer"
wandb_run_name: "dagformer-600m-dolmino"
log_every: 10
save_every: 2000
save_dir: "/work/hdd/bfqt/dagformer_checkpoints/fourway_600m_dolmino"
