# Per-token global predictor from scratch: LLM + predictor train together
# Predictor sees full sequence (bidirectional encoder), outputs per-position A
# Each token gets its own 192×192 routing matrix

hidden_size: 1024
num_hidden_layers: 12
num_attention_heads: 16
intermediate_size: 4096
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

predictor_type: "per_token_seq2matrix"
predictor_rank: 16
predictor_lr: 3e-4
predictor_encoder_dim: 256
predictor_encoder_layers: 2
predictor_encoder_heads: 4
predictor_max_seq_len: 4096
cascading_gate_k: 5.0
init_logit: 15.0
input_norm: "none"

tau_init: 5.0
tau_final: 0.2
lambda_max: 0.01
lambda_warmup_frac: 0.2

dataset: "allenai/dolma"
dataset_name: "v1_7"
seq_len: 1024
seed: 42

micro_batch_size: 4
gradient_accumulation_steps: 32
total_steps: 5000
lr: 5e-4
predictor_lr: 3e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 200
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 1000000
eval_size: 50
eval_every: 500

wandb_project: "dagformer"
wandb_run_name: "per-token-s2m-from0"
log_every: 10

save_every: 5000
save_dir: "checkpoints/pretrain_300m_per_token_s2m"
