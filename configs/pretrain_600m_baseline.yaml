# Dense OLMo-2 600M baseline (scaling law: between 300M and 1B)
# Architecture interpolates 300M (1024/12L/16H/4096) and 1B (2048/16L/16H/8192)
# Param count: ~682M (with tied embeddings)
# Token budget: 12B (~20× Chinchilla for 600M class)
#
# Batch: 8 micro × 8 accum × 8 GPUs × 1024 seq = 524,288 tokens/step
# Total steps: 22,900 → 12.0B tokens
# ~22h on 8× H200 at ~150K tok/s

hidden_size: 1536
num_hidden_layers: 14
num_attention_heads: 16
intermediate_size: 6144
vocab_size: 100352
tie_word_embeddings: true
max_position_embeddings: 4096
tokenizer_id: "allenai/OLMo-2-0425-1B"

dataset: "allenai/dolma"
dataset_name: "v1_7"
data_source: "mmap"
mmap_index_path: "/work/hdd/bfqt/data/pretok/dolma_v1_7_12b"
seq_len: 1024
seed: 42

micro_batch_size: 8
gradient_accumulation_steps: 8
total_steps: 22900
lr: 4.5e-4
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
warmup_steps: 500
max_grad_norm: 1.0
lr_schedule: "linear"

eval_skip: 0
eval_size: 0

wandb_project: "dagformer"
wandb_run_name: "baseline-600m-chinchilla"
log_every: 10
save_every: 2000
keep_last_n: 3
save_dir: "/work/hdd/bfqt/dagformer_checkpoints/pretrain_600m_baseline_mmap"
